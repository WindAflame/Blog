[[project]]
name = "Worms Armagaddon"
desc = """Ces invertébrés intrépides reviennent avec une vengeance dans le très apprécié Worms Armageddon. C'est une toute nouvelle boîte de vers ! C'est un amusement hilarant que vous pouvez apprécier seul ou avec tous vos amis.  
Worms Armageddon a été initialement développé comme une extension de Worms 2 et s'intitulait à l'origine Wormageddon avant d'être publié en tant que jeu autonome. Worms Armageddon a été acclamé par les critiques, qui ont loué le gameplay raffiné et les graphismes stylisés, et il a été présenté dans plusieurs listes des "meilleurs jeux de tous les temps". Worms Armageddon est toujours mis à jour périodiquement depuis 2020 et a été publié sur la plateforme Steam en 2013."""
