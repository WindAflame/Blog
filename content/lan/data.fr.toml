cover_url = "https://images.igdb.com/igdb/image/upload/t_cover_big/co1wkv.webp"
desc = "Poussant les limites de ce que les fans en viennent à attendre de la franchise de divertissement record, Call of Duty : Black Ops II propulse les joueurs dans un avenir proche, une guerre froide du 21e siècle, où la technologie et les armes ont convergé pour créer une nouvelle génération de guerre entre anciens et nouveaux ennemis. Dans ce conflit, les créations mécanisées des hommes règnent en maître, s'affrontant les unes contre les autres tandis que leurs créateurs restent en sécurité et sans conflit, et dans le processus deviennent de plus en plus doux. Dans ce scénario, une question importante sera posée : Que se passe-t-il lorsqu'un ennemi vole les clés de votre guerre ? Pour comprendre un tel avenir possible, vous devez comprendre d'où vous venez."
genre = "Shooter"
links = [
