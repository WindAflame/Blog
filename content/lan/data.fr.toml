[[project]]
name = "Minecraft"
desc = "Minecraft se concentre sur la possibilité pour le joueur d'explorer, d'interagir avec et de modifier une carte générée dynamiquement composée de blocs de un mètre cube. En plus des blocs, l'environnement comprend des plantes, des créatures et des objets. Certaines activités dans le jeu incluent l'extraction de minerai, le combat contre des créatures hostiles et la fabrication de nouveaux blocs et outils en rassemblant diverses ressources trouvées dans le jeu. Le modèle ouvert du jeu permet aux joueurs de créer des structures, des créations et des œuvres d'art sur divers serveurs multijoueurs ou sur leurs cartes en solo. D'autres fonctionnalités incluent des circuits en redstone pour des calculs logiques et des actions à distance, des wagonnets et des rails, ainsi qu'un monde mystérieux appelé le Nether. Un objectif désigné mais complètement optionnel du jeu est de voyager vers une dimension appelée l'End et de vaincre le dragon de l'End."
tags = ["Windows", "Linux", "Mac", "Console", "Phone", "LAN"]
genre = "Sandbox"
links = [
    { name = "Homepage", url = "https://www.minecraft.net" },
]
cover_url = "https://images.igdb.com/igdb/image/upload/t_cover_big/co8fu7.webp"

