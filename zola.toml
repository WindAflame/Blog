base_url = "http://localhost:1111"
theme = "linkita"

# Default language is english
default_language = "en"
author = "endyw"
minify_html = false

title = "EWA's blog"
description = ""
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [
  { name = "tags", feed = true, paginate_by = 5 },
  { name = "authors", feed = true, paginate_by = 5 },
]

[languages.fr]
title = "Blog EWA"
description = ""
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [
  { name = "tags", feed = true, paginate_by = 5 },
  { name = "authors", feed = true, paginate_by = 5 },
]

[markdown]
render_emoji = false
smart_punctuation = false
definition_list = true
bottom_footnotes = true
github_alerts = true

[markdown.highlighting]
error_on_missing_language = true
style = "inline"
light_theme = "light-plus"
dark_theme = "github-dark-default"

[extra]
math = false
mermaid = false
comment = true
title_separator = " | "
header_menu_name = "menu_header"
use_cdn = false
disable_default_favicon = false

[extra.menus]
menu_header = [
  { url = "@base/projects/", names = { "en" = "Project", "fr" = "Projet"} },
  { url = "@base/archive/", name = "Archive" },
  { url = "@base/about/", names = { "en" = "About me", "fr" = "A propos de" } },
]

