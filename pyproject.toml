[project]
name = "igdb-data-py"
version = "0.1.0"
description = "Fetch game data from IGDB API and generate JSON files for a blog"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "igdb-api-v4>=0.3.3",
    "python-dotenv>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
igdb-data = "src.main:main"
